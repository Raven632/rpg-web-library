# docker-compose.dev.yml (Локальная разработка)
services:
  rpg-library:
    # Заставляем сервер автоматически перезагружаться при изменениях
    command: nodemon server.js
    volumes:
      # Прокидываем всю папку src разом (там лежат db, routes, services)
      - ./api/src:/app/api/src
      # Главный файл сервера
      - ./api/server.js:/app/api/server.js
      # Ювелирно прокидываем только один скрипт из папки public
      - ./api/public/rpg-fixes.js:/app/api/public/rpg-fixes.js
      
    environment:
      - NODE_ENV=development
      
  frontend:
      image: node:20
      restart: unless-stopped
      working_dir: /app/frontend
      # Устанавливаем модули (если надо) и запускаем Vite с доступом по локалке
      command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
      volumes:
        # Прокидываем папку с исходниками React внутрь контейнера
        - ./frontend:/app/frontend
      ports:
        - "5173:5173" # Открываем порт Vite
      environment:
        - NODE_ENV=development
      depends_on:
        - rpg-library