services:
  # ====================================
  # 2. Кэш и Очереди (Redis)
  # ====================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Порт наружу не публикуем: Redis без пароля, бэкенд ходит к нему
    # по внутренней сети Docker (redis://redis:6379)

  # ====================================
  # 3. Твой Бэкенд
  # ====================================
  rpg-library:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HTTP_PORT:-80}:3000"
    volumes:
      - ${GAMES_HOST_DIR:-./games}:/games
    # Подключаем наш файл с секретами. Он необязателен: без него сервер
    # стартует на значениях по умолчанию, поэтому «скачал и запустил» работает.
    env_file:
      - path: .env
        required: false
    # Эти переменные перекроют те, что в .env (если есть совпадения)
    environment:
      - GAMES_DIR=/games
      - NODE_ENV=production
    restart: unless-stopped
    # Говорим Докеру: "Не запускай бэкенд, пока не поднимутся базы!"
    depends_on:
      - redis